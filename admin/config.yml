backend:
  name: github
  repo: Ranyuan-wind/Donnie-s-CV          # ⚠️ 替换为你的 GitHub 用户名/仓库名
  branch: main                  # ⚠️ 替换为你的分支名
  base_url: https://your-oauth-proxy.example.com  # 👈 部署 OAuth 代理后替换（见 README）

media_folder: "assets"
public_folder: "/assets"

locale: "zh_Hans"

collections:
  # ============================================
  # 简历数据 - 单文件集合
  # ============================================
  - name: "resume"
    label: "📋 简历数据"
    editor:
      preview: false
    files:
      - name: "resume_data"
        label: "简历内容"
        file: "data/resume.json"
        format: json
        fields:
          # --- 基本信息 ---
          - label: "基本信息"
            name: "basics"
            widget: "object"
            fields:
              - { label: "姓名", name: "name", widget: "string" }
              - { label: "职位", name: "label", widget: "string" }
              - { label: "邮箱", name: "email", widget: "string", required: false }
              - { label: "电话", name: "phone", widget: "string", required: false }
              - { label: "所在地", name: "location", widget: "string", required: false }
              - { label: "网站", name: "website", widget: "string", required: false }
              - { label: "个人简介", name: "summary", widget: "text" }
              - { label: "头像URL", name: "avatar", widget: "string", required: false }

          # --- 教育经历 ---
          - label: "教育经历"
            name: "education"
            widget: "list"
            fields:
              - { label: "学校", name: "school", widget: "string" }
              - { label: "类型标签(如985/双一流)", name: "type", widget: "string", required: false }
              - { label: "学位", name: "degree", widget: "string" }
              - { label: "专业", name: "major", widget: "string" }
              - { label: "开始时间", name: "startDate", widget: "string" }
              - { label: "结束时间", name: "endDate", widget: "string" }
              - label: "主修课程"
                name: "courses"
                widget: "list"
                required: false
                field: { label: "课程名", name: "course", widget: "string" }
              - label: "曾获荣誉"
                name: "honors"
                widget: "list"
                required: false
                field: { label: "荣誉", name: "honor", widget: "string" }
              - label: "竞赛奖项"
                name: "competitions"
                widget: "list"
                required: false
                field: { label: "奖项", name: "competition", widget: "string" }
              - label: "校园经历"
                name: "activities"
                widget: "list"
                required: false
                field: { label: "经历描述", name: "activity", widget: "text" }

          # --- 实习经历 ---
          - label: "实习经历"
            name: "internships"
            widget: "list"
            fields:
              - { label: "公司", name: "company", widget: "string" }
              - { label: "部门", name: "department", widget: "string" }
              - { label: "职位", name: "role", widget: "string" }
              - { label: "开始时间", name: "startDate", widget: "string" }
              - { label: "结束时间", name: "endDate", widget: "string" }
              - label: "工作亮点"
                name: "highlights"
                widget: "list"
                fields:
                  - { label: "标题", name: "title", widget: "string" }
                  - { label: "内容", name: "content", widget: "text" }

          # --- 项目经历 ---
          - label: "项目经历"
            name: "projects"
            widget: "list"
            fields:
              - { label: "项目名称", name: "name", widget: "string" }
              - { label: "角色", name: "role", widget: "string" }
              - { label: "时间", name: "date", widget: "string" }
              - label: "项目亮点"
                name: "highlights"
                widget: "list"
                fields:
                  - { label: "标题", name: "title", widget: "string" }
                  - { label: "内容", name: "content", widget: "text" }

          # --- 技能 ---
          - label: "技能信息"
            name: "skills"
            widget: "object"
            fields:
              - label: "专业技能"
                name: "technical"
                widget: "list"
                field: { label: "技能名", name: "skill", widget: "string" }
              - label: "语言能力"
                name: "languages"
                widget: "list"
                fields:
                  - { label: "语言", name: "name", widget: "string" }
                  - { label: "水平", name: "level", widget: "string" }
              - label: "证书"
                name: "certificates"
                widget: "list"
                field: { label: "证书名", name: "certificate", widget: "string" }

          # --- 个人特质 ---
          - label: "个人特质"
            name: "personal"
            widget: "list"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "内容", name: "content", widget: "text" }

# ============================================
# Site settings
# ============================================
site_url: "https://ranyuan-wind.github.io/Donnie-s-CV"
display_url: "https://ranyuan-wind.github.io/Donnie-s-CV"
logo_url: "https://ranyuan-wind.github.io/Donnie-s-CV/assets/logo.svg"
