backend:
  name: github
  repo: Ranyuan-wind/Donnie-s-CV
  branch: main
  base_url: https://your-oauth-proxy.example.com  # 👈 部署 OAuth 代理后替换（见 README）

media_folder: "assets"
public_folder: "/assets"

locale: "zh_Hans"

collections:
  # ============================================
  # Portfolio Data - Main Site Data
  # ============================================
  - name: "portfolio"
    label: "📋 作品集数据"
    editor:
      preview: false
    files:
      - name: "portfolio_data"
        label: "网站内容"
        file: "data/portfolio.json"
        format: json
        fields:
          # --- 基本信息 ---
          - label: "基本信息"
            name: "basics"
            widget: "object"
            fields:
              - { label: "姓名", name: "name", widget: "string" }
              - { label: "英文名", name: "nameEn", widget: "string", required: false }
              - { label: "职位", name: "label", widget: "string" }
              - { label: "英文职位", name: "labelEn", widget: "string", required: false }
              - { label: "邮箱", name: "email", widget: "string", required: false }
              - { label: "电话", name: "phone", widget: "string", required: false }
              - { label: "所在地", name: "location", widget: "string", required: false }
              - { label: "个人简介", name: "summary", widget: "text" }
              - { label: "英文简介", name: "summaryEn", widget: "text", required: false }
              - { label: "头像URL", name: "avatar", widget: "string", required: false }

          # --- 亮点卡片 ---
          - label: "核心亮点（首页三栏卡片）"
            name: "highlights"
            widget: "list"
            fields:
              - { label: "图标标识(school/ai/data)", name: "icon", widget: "string" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "副标题", name: "subtitle", widget: "string" }
              - { label: "描述", name: "description", widget: "text" }

          # --- 作品集项目 ---
          - label: "作品集项目"
            name: "portfolio"
            widget: "list"
            fields:
              - { label: "唯一ID", name: "id", widget: "string" }
              - { label: "类型(internship/project)", name: "type", widget: "string" }
              - label: "分类标签"
                name: "category"
                widget: "list"
                field: { label: "分类名", name: "cat", widget: "string" }
              - { label: "公司/项目名", name: "company", widget: "string" }
              - { label: "英文名", name: "companyEn", widget: "string", required: false }
              - { label: "部门", name: "department", widget: "string" }
              - { label: "角色", name: "role", widget: "string" }
              - { label: "时间", name: "date", widget: "string" }
              - { label: "状态标签", name: "status", widget: "string" }
              - { label: "卡片渐变色(CSS)", name: "gradient", widget: "string" }
              - { label: "Logo(文字/emoji)", name: "logo", widget: "string" }
              - { label: "摘要(2-3句)", name: "abstract", widget: "text" }
              - label: "策略关键词"
                name: "keywords"
                widget: "list"
                field: { label: "关键词", name: "kw", widget: "string" }
              - label: "详细信息"
                name: "details"
                widget: "object"
                fields:
                  - label: "亮点列表"
                    name: "highlights"
                    widget: "list"
                    fields:
                      - { label: "标题", name: "title", widget: "string" }
                      - { label: "内容", name: "content", widget: "text" }

          # --- 研究方向 ---
          - label: "研究方向"
            name: "researchInterests"
            widget: "list"
            fields:
              - { label: "图标标识(ai/data/global)", name: "icon", widget: "string" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "描述", name: "description", widget: "text" }

# ============================================
# Site settings
# ============================================
site_url: "https://ranyuan-wind.github.io/Donnie-s-CV"
display_url: "https://ranyuan-wind.github.io/Donnie-s-CV"
